name: Tests and installation

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run language and shell tests
        run: python -m unittest discover -s tests -v
      - name: Verify tutorials and local documentation links
        run: python tools/verify_tutorials.py
      - name: Install release build tools
        run: python -m pip install build twine
      - name: Build source, wheel, and starter kit
        run: python tools/prepare_release.py --output dist/release
      - name: Verify release contents and checksums
        run: python tools/verify_release.py dist/release
      - name: Verify installation outside checkout
        run: python tools/verify_install.py dist/release
      - name: Retain verified release downloads
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: preview-distributions
          path: dist/release/*
          if-no-files-found: error
